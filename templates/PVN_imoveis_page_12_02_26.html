                if (!this.images[key]) return this.images["placeholder"];

                if (!this.pdfs[key]) return null;
                return this.PATHS.pdf + this.pdfs[key];
            }

        // --- HOOKS ---
        const useOnScreen = (options) => {
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                        observer.disconnect();
                    }
                }, options);
                if (ref.current) observer.observe(ref.current);
                return () => { if (ref.current) observer.unobserve(ref.current); }
            }, [ref, options]);
            return [ref, isVisible];
        };

        const Reveal = ({ children, delay = 0 }) => {
            const [ref, isVisible] = useOnScreen({ threshold: 0.15 });
            return (
                <div ref={ref} className={`reveal-hidden ${isVisible ? 'reveal-visible' : ''}`} style={{ transitionDelay: `${delay}ms` }}>

                                    <div className="flex justify-between items-center text-sm">
                                        <span className="text-gray-500">Entrada:</span>
                                        <span className="font-bold text-gray-800">{data.installments}</span>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-3 mb-6 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                    <p className="font-bold text-pvn-blue text-center text-lg">{data.price}</p>
                                    <div className="flex flex-wrap gap-2 justify-center mt-2">
                                        {data.highlights?.map((h, i) => (
                                            <span key={i} className="text-[10px] bg-blue-100 text-blue-800 px-2 py-1 rounded-full">{h}</span>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="flex items-center gap-2 text-xs text-gray-500 mt-auto mb-6">
                            <Icon name="map-pin" size={14} className="text-pvn-blue shrink-0" />
                            <span className="truncate">{data.address}</span>
                        </div>

                        <button 
                            onClick={handlePdfClick}
                            className="w-full bg-white text-blue-600 border-2 border-blue-600 hover:bg-blue-600 hover:text-white font-bold py-3 px-4 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 text-sm uppercase tracking-wide group-hover:shadow-lg"
                        >
                            <Icon name="file-text" size={18} /> Ver Fotos / PDF
                        </button>
                    </div>
                </div>
            );
        };

        const CarouselSection = ({ title, highlight, items, type }) => {
            const scrollRef = useRef(null);

            const scroll = (direction) => {
                const { current } = scrollRef;
                if (current) {
                    const scrollAmount = direction === 'left' ? -400 : 400;
                    current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                }
            };

            return (
                <section className="py-24 bg-gray-50">
                    <div className="container mx-auto px-4">
                        <Reveal>
                            <div className="flex flex-col md:flex-row justify-between items-end mb-12 px-2 gap-4">
                                <div>
                                    <h2 className="text-4xl font-display font-black text-gray-900 uppercase">
                                        {title} <span className={`text-${type === 'direcional' ? 'orange-500' : 'pvn-blue'}`}>{highlight}</span>
                                    </h2>
                                    <p className="text-gray-500 mt-2">Deslize para ver as melhores opções</p>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => scroll('left')} className="p-4 rounded-full bg-white shadow-lg text-gray-400 hover:text-pvn-blue hover:scale-110 transition-all">
                                        <Icon name="arrow-left" />
                                    </button>
                                    <button onClick={() => scroll('right')} className="p-4 rounded-full bg-white shadow-lg text-gray-400 hover:text-pvn-blue hover:scale-110 transition-all">
                                        <Icon name="arrow-right" />
                                    </button>
                                </div>
                            </div>
                        </Reveal>

                        <Reveal delay={200}>
                            <div 
                                ref={scrollRef}
                                className="flex overflow-x-auto gap-8 pb-12 snap-x snap-mandatory px-4 md:px-0 hide-scrollbar pt-4"
                                style={{ scrollbarWidth: 'none', msOverflowStyle: 'none' }}
                            >
                                {items.map(item => (
                                    <div key={item.id} className="snap-center h-full">
                                        <PropertyCard data={item} type={type} />
                                    </div>
                                ))}
                            </div>
                        </Reveal>
                    </div>
                </section>
            );
        };

        const LeadFormSection = () => {
            const [form, setForm] = useState({ nome: '', telefone: '', email: '' });

            const handleChange = (e) => {
                setForm({ ...form, [e.target.name]: e.target.value });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const msg = `Olá Pedro! Meu nome é *${form.nome}* (${form.telefone}). Quero receber a tabela de preços. Meu email: ${form.email}`;
                window.open("https://wa.me/+5521997091499?text=" + encodeURIComponent(msg), "_blank");
            };

            return (
                <section id="contato" className="py-24 bg-gray-50 relative">
                     <div className="container mx-auto px-6">
                        <Reveal>
                            <div className="max-w-4xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
                                <div className="md:w-1/2 bg-pvn-blue p-12 text-white flex flex-col justify-center relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-full bg-pvn-accent opacity-10 rounded-full transform -translate-x-1/2 -translate-y-1/2 scale-150"></div>
                                    <h3 className="text-3xl font-display font-bold mb-4 relative z-10">Receba a Tabela de Preços</h3>
                                    <p className="text-blue-100 mb-8 relative z-10">Preencha seus dados para receber as condições exclusivas e a tabela atualizada dos empreendimentos.</p>
                                    <ul className="space-y-3 relative z-10">
                                        <li className="flex items-center gap-2"><Icon name="check-circle" size={18} className="text-pvn-accent"/> Subsídios atualizados</li>
                                        <li className="flex items-center gap-2"><Icon name="check-circle" size={18} className="text-pvn-accent"/> Simulação de financiamento</li>
                                        <li className="flex items-center gap-2"><Icon name="check-circle" size={18} className="text-pvn-accent"/> Atendimento prioritário</li>
                                    </ul>
                                </div>
                                <div className="md:w-1/2 p-12">
                                    <form onSubmit={handleSubmit} className="space-y-6">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-2">Nome Completo</label>
                                            <input 
                                                type="text" 
                                                name="nome"
                                                required
                                                className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-pvn-blue focus:ring-2 focus:ring-blue-100 outline-none transition-all"
                                                placeholder="Seu nome"
                                                onChange={handleChange}
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-2">WhatsApp / Telefone</label>
                                            <input 
                                                type="tel" 
                                                name="telefone"
                                                required
                                                className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-pvn-blue focus:ring-2 focus:ring-blue-100 outline-none transition-all"
                                                placeholder="(21) 99999-9999"
                                                onChange={handleChange}
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-2">E-mail</label>
                                            <input 
                                                type="email" 
                                                name="email"
                                                className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-pvn-blue focus:ring-2 focus:ring-blue-100 outline-none transition-all"
                                                placeholder="seu@email.com"
                                                onChange={handleChange}
                                            />
                                        </div>
                                        <button type="submit" className="w-full bg-pvn-accent hover:bg-lime-600 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2">
                                            <Icon name="send" size={20} />
                                            Solicitar Tabela Agora
                                        </button>
                                        <p className="text-xs text-gray-400 text-center mt-4">Seus dados estão seguros conosco.</p>
                                    </form>
                                </div>
                            </div>
                        </Reveal>
                     </div>
                </section>
            );
        };

        const DocumentsSection = () => {
            return (
                <section id="documentos" className="py-24 bg-gradient-to-br from-pvn-blue to-blue-900 text-white relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-full opacity-10" style={{backgroundImage: "radial-gradient(#ffffff 1px, transparent 1px)", backgroundSize: "30px 30px"}}></div>
                    <div className="container mx-auto px-6 relative z-10">
                        <Reveal>
                            <div className="text-center mb-16">
                                <h2 className="text-4xl font-display font-bold mb-4 uppercase">Documentação Necessária</h2>
                                <p className="text-blue-200">Prepare-se para conquistar seu sonho</p>
                            </div>
                        </Reveal>
                        <div className="grid md:grid-cols-2 gap-10 max-w-5xl mx-auto">
                            {documentsList.map((doc, idx) => (
                                <Reveal key={idx} delay={idx * 300}>

                                            <div className="p-3 bg-pvn-accent/20 rounded-full text-pvn-accent">
                                                <Icon name={idx === 0 ? "user" : "credit-card"} size={28} />
                                            </div>
                                            <h3 className="text-2xl font-bold text-white">{doc.category}</h3>
                                        </div>
                                        <ul className="space-y-4">
                                            {doc.items.map((item, i) => (
                                                <li key={i} className="flex items-start gap-4 text-lg font-light text-gray-200">
                                                    <Icon name="check" size={20} className="text-pvn-accent mt-1 shrink-0" />
                                                    <span>{item}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </Reveal>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const CtaSection = () => {
            return (
                <section className="parallax py-32 relative flex items-center justify-center" style={{ backgroundImage: `url('${AssetRepository.getImg("cta_bg")}')` }}>
                    <div className="absolute inset-0 bg-gray-900/80 backdrop-blur-[2px]"></div>
                    <div className="relative z-10 text-center max-w-4xl px-6">
                        <Reveal>
                            <h2 className="text-4xl md:text-5xl font-display font-bold text-white mb-8 leading-tight">Ainda com dúvidas?</h2>

                                Tire todas as suas dúvidas sobre preço, local, planta e unidades disponíveis.
                            </p>
                            <button 
                                onClick={handleWhatsappClick}
                                className="bg-green-500 hover:bg-green-600 text-white font-bold py-5 px-12 rounded-full uppercase tracking-widest shadow-[0_0_40px_rgba(34,197,94,0.4)] transform hover:scale-105 transition-all flex items-center justify-center mx-auto gap-3 text-xl"
                            >
                                <Icon name="message-circle" size={28} /> Falar no Whatsapp
                            </button>
                        </Reveal>
                    </div>
                </section>
            );
        };

        const Gallery = () => {
            return (
                <section id="galeria" className="py-24 bg-white">
                    <div className="container mx-auto px-6">
                        <Reveal>
                            <h2 className="text-3xl font-bold text-gray-900 text-center uppercase mb-16 tracking-widest">Galeria & Apresentações</h2>
                        </Reveal>
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
                            {galleryLinks.map((item, index) => (
                                <Reveal key={index} delay={index * 150}>
                                    <div 
                                        onClick={() => {
                                            const pdf = AssetRepository.getPdf(item.assetKey);
                                            if (pdf) window.open(pdf, '_blank');
                                        }}
                                        className="group relative block h-72 overflow-hidden rounded-2xl shadow-lg cursor-pointer"
                                    >
                                        <img 
                                            src={AssetRepository.getImg(item.assetKey)} 
                                            alt={item.title} 
                                            className="w-full h-full object-cover transition-transform duration-[1.5s] group-hover:scale-110" 
                                        />
                                        <div className="absolute inset-0 bg-black/40 group-hover:bg-black/60 transition-colors duration-500"></div>
                                        <div className="absolute inset-0 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-500 transform translate-y-4 group-hover:translate-y-0">
                                            <div className="bg-white/20 backdrop-blur-md p-4 rounded-full mb-3 text-white">
                                                <Icon name="download" size={24} />
                                            </div>
                                            <h4 className="text-white text-xl font-bold text-center px-4">{item.title}</h4>
                                            <p className="text-pvn-accent text-sm font-bold uppercase mt-2">Baixar PDF</p>
                                        </div>
                                    </div>
                                </Reveal>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => {
            return (
                <footer className="bg-pvn-dark text-white pt-20 pb-10 border-t border-gray-800">
                    <div className="container mx-auto px-6">
                        <div className="grid md:grid-cols-4 gap-12 mb-16">
                            <div className="col-span-1">
                                <h2 className="text-4xl font-display font-black text-white mb-6">PVN</h2>
                                <p className="text-gray-400 text-sm leading-relaxed">
                                    Corretor Pedro Veras.<br/>
                                    Compromisso com o seu sonho da casa própria. Atendimento personalizado e transparente.
                                </p>
                            </div>
                            
                            <div>
                                <h4 className="font-bold text-lg mb-6 text-pvn-accent uppercase tracking-wider">Navegação</h4>
                                <ul className="space-y-3">
                                    {navigationData.map(item => (
                                        <li key={item.name}>
                                            <a href={item.href} className="text-gray-400 hover:text-white transition-colors hover:translate-x-1 inline-block">{item.name}</a>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div>
                                <h4 className="font-bold text-lg mb-6 text-pvn-accent uppercase tracking-wider">Contatos</h4>
                                <ul className="space-y-4 text-gray-400">
                                    <li className="flex items-center gap-3 group">
                                        <div className="p-2 bg-gray-800 rounded-lg group-hover:bg-pvn-blue transition-colors">
                                            <Icon name="mail" size={16}/>
                                        </div>
                                        pedroveras2803@gmail.com
                                    </li>
                                    <li className="flex items-center gap-3 group">
                                        <div className="p-2 bg-gray-800 rounded-lg group-hover:bg-pvn-accent transition-colors">
                                            <Icon name="phone" size={16}/>
                                        </div>
                                        (21) 999289987
                                    </li>
                                </ul>
                            </div>

                            <div>
                                <h4 className="font-bold text-lg mb-6 text-pvn-accent uppercase tracking-wider">Redes</h4>
                                <div className="flex gap-4">
                                    <a href="https://www.instagram.com/direcional.rj/" target="_blank" className="w-12 h-12 bg-gray-800 rounded-full flex items-center justify-center hover:bg-pink-600 transition-all hover:-translate-y-1">
                                        <Icon name="instagram" size={24} />
                                    </a>
                                    <a href="https://direcional.com.br/encontre-seu-apartamento/" target="_blank" className="w-12 h-12 bg-gray-800 rounded-full flex items-center justify-center hover:bg-blue-600 transition-all hover:-translate-y-1">
                                        <Icon name="globe" size={24} />
                                    </a>
                                </div>
                            </div>
                        </div>
                        
                        <div className="border-t border-gray-800 pt-8 flex flex-col md:flex-row justify-between items-center text-sm text-gray-500">
                            <p>Copyright &copy; PVN Imóveis 2023. Todos os direitos reservados.</p>
                            <p className="mt-2 md:mt-0">Desenvolvido com tecnologia moderna.</p>
                        </div>
                    </div>
                </footer>
            );
        };

        const App = () => {
            useEffect(() => { lucide.createIcons(); }, []);

            return (
                <div className="flex flex-col min-h-screen">
                    <Navbar />
                    <Hero />
                    <About />
                    <div id="empreendimentos">
                        <CarouselSection title="Empreendimentos" highlight="Direcional" items={direcionalData} type="direcional" />
                        <CarouselSection title="Riva" highlight="Incorporadora" items={rivaData} type="riva" />
                    </div>
                    {/* Formulário inserido aqui */}
                    <LeadFormSection />
                    <DocumentsSection />
                    <CtaSection />
                    <Gallery />
                    <Footer />
                    
                    <button 
                        onClick={handleWhatsappClick}
                        className="fixed bottom-8 right-8 bg-green-500 hover:bg-green-600 text-white p-4 rounded-full shadow-[0_4px_20px_rgba(34,197,94,0.5)] z-50 transition-all hover:scale-110 hover:-translate-y-1 animate-float"
                        aria-label="Falar no Whatsapp"
                    >
                        <Icon name="message-circle" size={32} fill="white" />
                    </button>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
